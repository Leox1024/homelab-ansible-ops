---
# Quick health check of an inventory: SSH login, Python and sudo.
# Set ping_check_sudo: false for hosts where the login user has no sudo.
- name: Linux | check SSH, Python and sudo
  hosts: all
  gather_facts: false

  vars:
    ping_check_sudo: true

  tasks:
    - name: Reach the host over SSH
      ansible.builtin.ping:

    - name: Check sudo
      ansible.builtin.command: id -un
      become: true
      register: ping_become
      changed_when: false
      failed_when: ping_become.stdout != 'root'
      when: ping_check_sudo | bool
