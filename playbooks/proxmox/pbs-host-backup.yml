---
# Backs up the configuration of each Proxmox VE node to Proxmox Backup Server
# (backup type "host", one group per node). Restore with proxmox-backup-client restore.
# Semaphore: pbs-backup-client-pve (daily); pbs_secret and pbs_fingerprint come from
# the hyperv-pbs-client-backup-pve variable group.
- name: Proxmox VE | back up node configuration to PBS
  hosts: all
  gather_facts: false

  vars:
    pbs_server: 10.100.60.75
    pbs_datastore: hosts-backup
    pbs_username: root@pam!hosts-backup
    pbs_secret: "{{ vault_pbs_secret }}"
    pbs_fingerprint: ""
    pbs_environment:
      PBS_REPOSITORY: "{{ pbs_username }}@{{ pbs_server }}:{{ pbs_datastore }}"
      PBS_PASSWORD: "{{ pbs_secret }}"
      PBS_FINGERPRINT: "{{ pbs_fingerprint }}"
    # Used only when sudo is not available: the files readable without root.
    pbs_fallback_dir: /home/{{ ansible_user }}/host-backup
    pbs_fallback_files:
      - /etc/hosts
      - /etc/hostname
      - /etc/resolv.conf
      - /etc/network/interfaces

  tasks:
    - name: Back up the node configuration
      block:
        # /etc/pve is the pmxcfs FUSE mount (VM/CT configs, storage.cfg, corosync, firewall):
        # pxar does not cross mount points, so it has to be included explicitly.
        - name: Back up /etc, including /etc/pve
          ansible.builtin.command:
            argv:
              - proxmox-backup-client
              - backup
              - etc.pxar:/etc
              - --include-dev
              - /etc/pve
          environment: "{{ pbs_environment }}"
          become: true
          register: pbs_backup
          changed_when: true

      rescue:
        - name: Explain the fallback
          ansible.builtin.debug:
            msg: >-
              Full /etc backup failed ({{ ansible_failed_result.msg | default('see above') }}):
              falling back to the network files only. Check sudo for {{ ansible_user }}.

        - name: Create the staging directory
          ansible.builtin.file:
            path: "{{ pbs_fallback_dir }}"
            state: directory
            mode: "0700"

        - name: Stage the network files
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ pbs_fallback_dir }}/{{ item | basename }}"
            remote_src: true
            mode: preserve
          loop: "{{ pbs_fallback_files }}"

        - name: Back up the staged files
          ansible.builtin.command:
            argv:
              - proxmox-backup-client
              - backup
              - host-config.pxar:{{ pbs_fallback_dir }}
          environment: "{{ pbs_environment }}"
          register: pbs_backup
          changed_when: true

    - name: Show backup result
      ansible.builtin.debug:
        msg: "{{ pbs_backup.stderr_lines | select('search', 'Upload|Duration|End Time|snapshot') | list }}"
