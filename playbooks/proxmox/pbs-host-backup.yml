---
# Backs up the basic configuration files of each Proxmox VE node (hosts, hostname, DNS,
# network) to Proxmox Backup Server, as a "host" backup. Runs without sudo on purpose:
# only files readable by the login user are included.
# Required variables: pbs_server, pbs_datastore, pbs_username, pbs_secret, pbs_fingerprint.
- name: Proxmox VE | back up node configuration files to PBS
  hosts: all
  gather_facts: true

  vars:
    pbs_staging_dir: "{{ ansible_env.HOME }}/host-backup"
    pbs_backup_files:
      - /etc/hosts
      - /etc/hostname
      - /etc/resolv.conf
      - /etc/network/interfaces

  tasks:
    - name: Create the staging directory
      ansible.builtin.file:
        path: "{{ pbs_staging_dir }}"
        state: directory
        mode: "0700"

    - name: Copy the configuration files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ pbs_staging_dir }}/{{ item | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ pbs_backup_files }}"

    - name: Back up the staging directory to PBS
      ansible.builtin.command:
        argv:
          - proxmox-backup-client
          - backup
          - host-config.pxar:{{ pbs_staging_dir }}
      environment:
        PBS_REPOSITORY: "{{ pbs_username }}@{{ pbs_server }}:{{ pbs_datastore }}"
        PBS_PASSWORD: "{{ pbs_secret }}"
        PBS_FINGERPRINT: "{{ pbs_fingerprint }}"
      register: pbs_backup
      changed_when: true

    - name: Show backup result
      ansible.builtin.debug:
        msg: "{{ pbs_backup.stderr_lines | select('search', 'Upload|Duration|End Time|snapshot') | list }}"
