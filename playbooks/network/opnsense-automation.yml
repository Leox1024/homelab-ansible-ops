---
# Installs what the automation may run on OPNsense, and limits its key to it: the key
# gets the forced command semaphore-gate, which only allows reading config.xml
# (config-backup.yml) and vlan-provision (vlan-add.yml).
# Also installs the gateway monitor hook 50-killstates-linkdown: when a DHCP uplink loses
# its link, the gateway has no address left and "Failover States" kills nothing; the hook
# kills the states of the last router in the DHCP lease. It lives outside config.xml.
# With opnsense_checkmk_key set, also installs cmk-agent-opnsense and limits that key to
# it: Checkmk runs it over SSH ("Individual program call instead of agent access") for
# the uplinks, failover, pf states, temperature, DNS, DHCP pools and core services.
# Run it as root with an admin key, not with the automation key.
# Variables: opnsense_automation_key (public key), opnsense_automation_from (address the
# automation connects from), opnsense_checkmk_key and opnsense_checkmk_from (the same for
# Checkmk, optional).

- name: OPNsense | automation commands
  hosts: opnsense
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/local/bin/python3
    opnsense_automation_user: root
    opnsense_automation_key: ""
    opnsense_automation_from: ""
    opnsense_checkmk_key: ""
    opnsense_checkmk_from: ""

  handlers:
    - name: Write the authorized keys of the user
      ansible.builtin.command: /usr/local/opnsense/scripts/auth/sync_user.php -u {{ opnsense_automation_user }}
      changed_when: true

  tasks:
    - name: Require the automation key
      ansible.builtin.assert:
        that: opnsense_automation_key is match('^(ssh-|ecdsa-)')
        fail_msg: Set opnsense_automation_key to the automation public key
        quiet: true

    - name: Install the commands
      ansible.builtin.copy:
        src: files/{{ item }}
        dest: /usr/local/sbin/{{ item }}
        owner: root
        group: wheel
        mode: "0755"
      loop:
        - vlan-provision
        - semaphore-gate

    - name: Install the gateway monitor hook
      ansible.builtin.copy:
        src: files/50-killstates-linkdown
        dest: /usr/local/etc/rc.syshook.d/monitor/50-killstates-linkdown
        owner: root
        group: wheel
        mode: "0755"

    - name: Limit the automation key to semaphore-gate
      ansible.builtin.script: files/opnsense-authorize-key.php
      args:
        executable: /usr/local/bin/php
      environment:
        AUTH_USER: "{{ opnsense_automation_user }}"
        AUTH_ENTRY: >-
          restrict,{{ ('from="' ~ opnsense_automation_from ~ '",') if opnsense_automation_from else '' }}command="/usr/local/sbin/semaphore-gate"
          {{ opnsense_automation_key }}
      register: opnsense_key
      changed_when: opnsense_key.stdout is search('^changed', multiline=True)
      notify: Write the authorized keys of the user

    - name: Checkmk agent
      when: opnsense_checkmk_key | length > 0
      block:
        - name: Require a Checkmk public key
          ansible.builtin.assert:
            that: opnsense_checkmk_key is match('^(ssh-|ecdsa-)')
            fail_msg: opnsense_checkmk_key must be a public key
            quiet: true

        - name: Install the Checkmk agent
          ansible.builtin.copy:
            src: files/cmk-agent-opnsense
            dest: /usr/local/sbin/cmk-agent-opnsense
            owner: root
            group: wheel
            mode: "0755"

        - name: Limit the Checkmk key to cmk-agent-opnsense
          ansible.builtin.script: files/opnsense-authorize-key.php
          args:
            executable: /usr/local/bin/php
          environment:
            AUTH_USER: "{{ opnsense_automation_user }}"
            AUTH_ENTRY: >-
              restrict,{{ ('from="' ~ opnsense_checkmk_from ~ '",') if opnsense_checkmk_from else '' }}command="/usr/local/sbin/cmk-agent-opnsense"
              {{ opnsense_checkmk_key }}
          register: opnsense_checkmk
          changed_when: opnsense_checkmk.stdout is search('^changed', multiline=True)
          notify: Write the authorized keys of the user
