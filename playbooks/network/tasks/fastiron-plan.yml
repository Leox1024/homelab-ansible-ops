---
# Downloads the switch running and saved configurations, and plans the VLAN on the
# running one (files/fastiron-vlan-plan.py). Runs on the controller, from a play on the
# switch. Expects: switch_tmp (directory), switch_password, vlan_tag.
# Sets switch_plan, and switch_saved (the VLAN is in the saved configuration).

- name: Download the running and saved configurations
  loop: [runConfig, startConfig]
  ansible.builtin.command:
    argv:
      - sshpass
      - -e
      - scp
      - -O
      # The switch sends the file under another name than runConfig.
      - -T
      - -o
      - KexAlgorithms=+diffie-hellman-group1-sha1
      - -o
      - HostKeyAlgorithms=+ssh-rsa
      - -o
      - PubkeyAuthentication=no
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile={{ switch_tmp.path }}/known_hosts
      - "{{ ansible_user }}@{{ ansible_host }}:{{ item }}"
      - "{{ switch_tmp.path }}/{{ item }}.txt"
  environment:
    SSHPASS: "{{ switch_password }}"
  changed_when: false

- name: Plan the VLAN on the trunk ports
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/files/fastiron-vlan-plan.py"
      - "{{ switch_tmp.path }}/runConfig.txt"
      - "{{ vlan_tag }}"
  register: switch_plan_out
  changed_when: false

- name: Read the plan
  ansible.builtin.set_fact:
    switch_plan: "{{ switch_plan_out.stdout | from_json }}"
    switch_saved: "{{ lookup('ansible.builtin.file', switch_tmp.path ~ '/startConfig.txt') is search('(?m)^vlan ' ~ vlan_tag ~ ' ') }}"
