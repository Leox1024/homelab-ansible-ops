---
# Backs up the OPNsense config.xml and the switch running-config to a directory on a
# backup host: <dir>/<device>/<file> is always the latest copy, <dir>/<device>/history/
# keeps a dated copy every time the content changes.
# Inventory groups: opnsense, switches (switch_host_key), backup_target.
# Variables: network_backup_dir, network_backup_owner, brocade_password (secret; the
# switch is skipped while it is empty).
# A device that cannot be read does not stop the others: what was read is stored, then
# the run fails and names the device.

- name: Network | read OPNsense config.xml
  hosts: opnsense
  gather_facts: false

  vars:
    # A key restricted with "restrict" gets no pty, and with -tt the command output is lost.
    ansible_ssh_use_tty: false

  tasks:
    - name: Read the firewall configuration
      block:
        # Works with a key restricted to this command (authorized_keys command="...").
        - name: Read config.xml
          ansible.builtin.raw: cat /conf/config.xml
          register: opnsense_config
          changed_when: false
          no_log: true

        - name: Check the config is complete
          ansible.builtin.assert:
            that:
              - opnsense_config.stdout is match('<\?xml')
              - opnsense_config.stdout is search('</opnsense>\s*$')
            fail_msg: config.xml looks empty or truncated
            quiet: true

        - name: Queue config.xml for storage
          ansible.builtin.set_fact:
            network_backup:
              device: "{{ inventory_hostname }}"
              file: config.xml
              content: "{{ opnsense_config.stdout }}"
          no_log: true

      rescue:
        - name: Remember the failure
          ansible.builtin.set_fact:
            network_backup_error: "{{ ansible_failed_result.msg | default('read failed') }}"

- name: Network | read switch running-config
  hosts: switches
  gather_facts: false

  vars:
    switch_password: "{{ brocade_password | default('') }}"

  tasks:
    - name: Skip the switch until its password is set
      when: switch_password | length == 0
      block:
        - name: Explain why the switch is skipped
          ansible.builtin.debug:
            msg: No switch password (brocade_password) set, skipping {{ inventory_hostname }}

        - name: Skip this switch
          ansible.builtin.meta: end_host

    - name: Download running-config
      delegate_to: localhost
      block:
        - name: Create a temporary directory
          ansible.builtin.tempfile:
            state: directory
          register: switch_tmp

        - name: Pin the switch host key
          ansible.builtin.copy:
            dest: "{{ switch_tmp.path }}/known_hosts"
            content: "{{ ansible_host }} {{ switch_host_key }}\n"
            mode: "0600"

        # FastIron 08.0.x: password only, legacy key exchange and legacy SCP protocol (-O).
        # -T: the switch sends the file under another name than runConfig.
        - name: Copy runConfig over SCP
          ansible.builtin.command:
            argv:
              - sshpass
              - -e
              - scp
              - -O
              - -T
              - -o
              - KexAlgorithms=+diffie-hellman-group1-sha1
              - -o
              - HostKeyAlgorithms=+ssh-rsa
              - -o
              - PubkeyAuthentication=no
              - -o
              - StrictHostKeyChecking=yes
              - -o
              - UserKnownHostsFile={{ switch_tmp.path }}/known_hosts
              - "{{ ansible_user }}@{{ ansible_host }}:runConfig"
              - "{{ switch_tmp.path }}/running-config.txt"
          environment:
            SSHPASS: "{{ switch_password }}"
          changed_when: false

        - name: Queue running-config for storage
          ansible.builtin.set_fact:
            network_backup:
              device: "{{ inventory_hostname }}"
              file: running-config.txt
              content: "{{ lookup('ansible.builtin.file', switch_tmp.path ~ '/running-config.txt') }}"
          no_log: true

      rescue:
        - name: Remember the failure
          ansible.builtin.set_fact:
            network_backup_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg, true) | default('read failed') }}"

      always:
        - name: Remove the temporary directory
          ansible.builtin.file:
            path: "{{ switch_tmp.path }}"
            state: absent
          when: switch_tmp.path is defined

- name: Network | store backups on the backup host
  hosts: backup_target
  gather_facts: false

  vars:
    # network_backup_dir and network_backup_owner (the account that must be able to read
    # the backups) are required.
    network_backup_history_days: 365
    network_backup_stamp: "{{ now(fmt='%Y-%m-%d_%H%M') }}"
    network_backups: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('network_backup', 'defined')
         | map(attribute='network_backup') | list }}
    network_backup_errors: >-
      {%- set out = {} -%}
      {%- for h in groups['all'] if hostvars[h].network_backup_error is defined -%}
      {%- set _ = out.update({h: hostvars[h].network_backup_error}) -%}
      {%- endfor -%}
      {{ out }}

  tasks:
    - name: Require the backup directory and its owner
      ansible.builtin.assert:
        that:
          - network_backup_dir is defined
          - network_backup_owner is defined
        fail_msg: Set network_backup_dir and network_backup_owner
        quiet: true

    - name: Create the device directories
      ansible.builtin.file:
        path: "{{ network_backup_dir }}/{{ item.device }}/history"
        state: directory
        mode: "0770"
      loop: "{{ network_backups }}"
      loop_control:
        label: "{{ item.device }}"

    - name: Save the latest copy
      ansible.builtin.copy:
        dest: "{{ network_backup_dir }}/{{ item.device }}/{{ item.file }}"
        content: "{{ item.content }}"
        mode: "0660"
      loop: "{{ network_backups }}"
      register: network_backup_latest
      no_log: true

    - name: Keep a dated copy of what changed
      ansible.builtin.copy:
        src: "{{ item.dest }}"
        dest: "{{ network_backup_dir }}/{{ item.item.device }}/history/{{ network_backup_stamp }}_{{ item.item.file }}"
        remote_src: true
        mode: "0660"
      loop: "{{ network_backup_latest.results }}"
      when: item.changed  # noqa: no-handler (one copy per changed item of a loop)
      no_log: true

    - name: Report what changed
      ansible.builtin.debug:
        msg: >-
          {{ dict(network_backup_latest.results | map(attribute='item.device')
                  | zip(network_backup_latest.results | map(attribute='changed'))) }}

    # Files are created by the backup user: give the owner access to them.
    - name: Give the owner access to the backups
      ansible.builtin.command:
        argv:
          - setfacl
          - -R
          - -m
          - u:{{ network_backup_owner }}:rwX,d:u:{{ network_backup_owner }}:rwX
          - "{{ network_backup_dir }}/{{ item.device }}"
      loop: "{{ network_backups }}"
      loop_control:
        label: "{{ item.device }}"
      changed_when: false

    - name: Find dated copies past retention
      ansible.builtin.find:
        paths: "{{ network_backups | map(attribute='device') | map('regex_replace', '^(.*)$', network_backup_dir ~ '/\\1/history') | list }}"
        age: "{{ network_backup_history_days }}d"
      register: network_backup_expired
      when: network_backups | length > 0

    - name: Delete dated copies past retention
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ network_backup_expired.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Fail for the devices that could not be read
      ansible.builtin.fail:
        msg: "Not backed up: {{ network_backup_errors }}"
      when: network_backup_errors | length > 0
